services:
  db-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test-only-password
      MYSQL_DATABASE: zhilian_service_platform_test
    ports:
      - "33306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptest-only-password"]
      interval: 5s
      timeout: 3s
      retries: 20
